<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3a 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; max-width: 1100px; }
  .eyebrow {
    font-size: 20px; letter-spacing: 4px; text-transform: uppercase;
    color: #54a0ff; margin-bottom: 32px; font-weight: 600;
  }
  h1 {
    font-size: 90px; font-weight: 900; line-height: 1.05;
    background: linear-gradient(135deg, #fff 0%, #54a0ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 48px;
  }
  .url-box {
    display: inline-block;
    background: rgba(84,160,255,0.15);
    border: 2px solid #54a0ff;
    border-radius: 16px;
    padding: 24px 60px;
    font-size: 42px; font-weight: 700; color: #54a0ff;
    letter-spacing: 1px;
    margin-bottom: 48px;
  }
  .sub { font-size: 26px; color: #aaa; line-height: 1.5; }
  .cta-btn {
    display: inline-block;
    margin-top: 48px;
    background: linear-gradient(135deg, #54a0ff, #2e86de);
    color: #fff;
    font-size: 28px; font-weight: 700;
    padding: 22px 60px;
    border-radius: 50px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Jetzt handeln</div>
    <h1>Bevor du kaufst,<br>check es kurz.</h1>
    <div class="url-box">kurs-erfahrungen.com</div>
    <div class="sub">3 Minuten Recherche · Hunderte Euro gespart · Keine Anmeldung nötig</div>
    <div class="cta-btn">🔗 Link in der Beschreibung</div>
  </div>
</body>
</html>
